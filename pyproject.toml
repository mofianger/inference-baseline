[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-baseline"
version = "0.1.0"
description = "Protocol-driven, model-only VLA inference benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
inference-bench = "inference_baseline.cli:main"

[tool.setuptools.packages.find]
include = ["inference_baseline*"]
